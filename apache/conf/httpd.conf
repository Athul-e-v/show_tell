ServerRoot "/home/jothiswaranoh5717/show_tell/apache"
ServerName jodhig.selfmade.buzz

Listen 8080

PidFile run/apache.pid
ErrorLog logs/error.log
LogLevel warn

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so

TypesConfig /etc/mime.types

DirectoryIndex index.html

DocumentRoot "/home/jothiswaranoh5717/show_tell/web_app/dist"

<Directory "/home/jothiswaranoh5717/show_tell/web_app/dist">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.html
</Directory>

ProxyRequests Off
ProxyPreserveHost On

ProxyPass /api/ http://127.0.0.1:8000/api/
ProxyPassReverse /api/ http://127.0.0.1:8000/api/

LogFormat "%h %l %u %t \"%r\" %>s %b" combined
CustomLog logs/access.log combined
